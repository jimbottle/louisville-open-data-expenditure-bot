# Louisville city config pack — generated from the pre-refactor Python
# structures (data_model.py, agency_mapping.py, payee_mapping.py).
# Schema documented in docs/canonical-model.md §4.
city:
  name: Louisville
  state: KY
  title: Louisville Open Data
  fiscal_year_start_month: 7

# Everything the frontend shows, so a second city's deployment never says
# "Louisville". Served by GET /api/config and applied on page load.
branding:
  bot_name: Lou
  tab_title: Lou · Louisville Metro open data
  subtitle: The publicly shared data from Louisville Metro
  hero_heading: Ask me about Louisville Metro Government expenditure. I might have some answers.
  hero_blurb: >-
    Natural language queries run against Louisville Metro expenditure, salary,
    capital projects, contractor, and staffing data, covering fiscal years 2008
    to 2026.
  input_placeholder: Enter your question about Louisville Metro Government expenditure here...
  input_aria_label: Ask a question about Louisville Metro data
  # Rendered as HTML into the About tooltip. Authored in the pack (trusted
  # content) so a city's own attribution, license and disclaimer travel with
  # it — never another city's legal text.
  about_html: >-
    <strong>About this data</strong><br>
    Data sourced from <a href="https://data.louisvilleky.gov/datasets/"
    target="_blank" rel="noopener">Louisville Metro Open Data Portal</a>,
    published by Louisville/Jefferson County Metro Government and LOJIC.<br><br>
    Use of this data is governed by the <a
    href="https://louisville-metro-opendata-lojic.hub.arcgis.com/pages/terms-of-use-and-license"
    target="_blank" rel="noopener">Louisville Metro Open Data Terms of Use and
    License</a>. Open data is provided for public access and reuse under
    Louisville Metro's Open Data Ordinance, which encourages the use of
    publicly available datasets to promote transparency, civic engagement, and
    innovation. Data is provided as-is without warranty.<br><br>
    This tool is an independent project and is not affiliated with or endorsed
    by Louisville Metro Government.
  starter_groups:
    - label: Spending
      chips:
        - ["How has spending changed over time?", "How has total annual spending changed from 2008 to 2026?"]
        - ["Which agencies spend the most?", "Which agencies have spent the most money across all fiscal years?"]
        - ["LMPD spending by year", "Give me a year-over-year breakdown of LMPD spending"]
    - label: People & pay
      chips:
        - ["What do top officials earn?", "How much does the mayor make? What about the police chief?"]
        - ["Highest paid positions", "What are the highest paid positions in Louisville Metro government?"]
    - label: Contracts & projects
      chips:
        - ["Who runs the top contractors?", "Who are the registered agents for the top 10 contractors by total spend?"]
        - ["Largest capital projects", "What are the largest capital projects and how much was allocated to each?"]
        - ["Grant funding breakdown", "How much grant funding has Louisville received and from which sources?"]

# Facts the answer-writing prompts must enforce (injected into the interpret
# and refine system prompts — per-city, so a city whose data DOES include
# benefits simply states different facts here).
data_facts:
  - Compensation figures are pay components only (regular, overtime, incentive,
    other); the data contains no benefits information, so never describe an
    amount as including benefits.
  # Year coverage is NOT stated here: it is derived from the loaded data at
  # startup (how far payments actually run vs. the fiscal year end) and
  # appended as a fact, so a refresh can never leave it asserting a stale
  # year. Facts here may use {placeholders}; CityConfig.data_facts_for()
  # resolves them and drops any fact left unresolved.

# Document corpus for retrieval (docs/rag-spike.md). Council legislation IS the
# appropriation record, so it is the "why" behind the numbers. Per-city because
# every Legistar city has its own client name and matter type ids; a pack that
# omits this block falls back to rag.py's Louisville defaults.
rag:
  legistar_client: louisville
  # Resolution, Ordinance, Capital Infrastructure Fund, Neighborhood
  # Development Fund, Municipal Aid Program Funds, Paving Funds
  matter_type_ids: [52, 53, 64, 65, 66, 70]
  since: "2020-01-01"
  # Bare filename: resolved against DATA_DIR so the same pack works in a dev
  # checkout (./data) and in the container (/data).
  db: rag_documents.duckdb
  # BM25 score is a cutoff for noise, NOT a relevance signal, and raising it
  # will not buy precision. Measured 2026-08-13 across on- and off-topic
  # questions: "which agencies have spent the most" scores 4.92 and "highest
  # paid positions" 4.56 against legislation that explains neither, while a
  # genuinely on-topic Neighborhood Development Fund question scores 3.07. The
  # off-topic questions score HIGHER, so a higher floor drops real hits first.
  # (An earlier note here claimed real hits land ~5+; that is not what the
  # corpus does.) Relevance is decided downstream: the interpret prompt tells
  # the model to judge each document on subject matter, and _cited_documents
  # surfaces only the ones it actually named.
  min_score: 3.0
  k: 3

expenditures:
  table: expenditures
  sources:
  - id: era_2018_plus
    reader: duckdb_union
    files: eExpenditures_{year}.csv
    years:
    - 2018
    - 2026
  - id: era_2008_2017
    reader: pandas_mapped
    files: eExpenditures_{year}.csv
    years:
    - 2008
    - 2017
    column_map:
      Fiscal_Year: fiscal_year
      Vendor_Name: payee
      InvoiceID: invoice_number
      InvoiceDt: invoice_date
      InvoiceAmt: invoice_amount
      CheckID: payment_number
      CheckDt: payment_date
      CheckAmt: payment_amount
      CheckVoidDt: payment_void_date
      Agency_Name: agency
      Sub_Agency_Name: sub_agency
      DepartmentName: department
      Sub_DepartmentName: sub_department
      Budget_Type: expenditure_type
      Category: expenditure_category
      Sub_Category: spend_category
      Stimulus_Type: stimulus_type
      Funding_Source: fund
      DistributionAmt: extended_amount
    drop:
    - ObjectId
    coerce:
      fiscal_year: int
      invoice_date: epoch_ms_date
      payment_date: epoch_ms_date
      payment_void_date: epoch_ms_date
canonicalization:
- table: expenditures
  source_column: agency
  target_column: agency_canonical
  exact_map: agency_map.csv
  case_insensitive: false
- table: expenditures
  source_column: payee
  target_column: payee_canonical
  exact_map: payee_map.csv
  prefix_map: payee_prefix_map.csv
  case_insensitive: true
data_quality:
  table: expenditures
  amount_column: extended_amount
  offsetting:
    group_key: invoice_number
    tolerance: 0.01
  artifact:
    group_key: invoice_number
    threshold: 100000000
enrichment_tables:
  salary_data: salary_data.csv
  capital_projects: capital_projects.csv
  active_contractors: active_contractors.csv
  staff_demographics: staff_demographics.csv
  hr_requisitions: hr_requisitions.csv
  contractor_profiles: contractor_profiles.csv
summaries:
- table: summary_agency_spend
  question: Which agencies have spent the most money across all fiscal years?
  sql: |-
    CREATE TABLE summary_agency_spend AS
    SELECT agency_canonical AS agency, ROUND(SUM(extended_amount), 2) AS total_spend,
           COUNT(*) AS transaction_count, MIN(fiscal_year) AS first_year, MAX(fiscal_year) AS last_year
    FROM expenditures WHERE is_data_artifact = FALSE
    GROUP BY agency_canonical ORDER BY total_spend DESC
- table: summary_annual_spend
  question: How has total annual spending changed from 2008 to 2026?
  sql: |-
    CREATE TABLE summary_annual_spend AS
    SELECT fiscal_year, ROUND(SUM(extended_amount), 2) AS total_spend,
           COUNT(*) AS transaction_count
    FROM expenditures WHERE is_data_artifact = FALSE AND fiscal_year IS NOT NULL
    GROUP BY fiscal_year ORDER BY fiscal_year
- table: summary_largest_payments
  question: What are the largest single payments ever made?
  sql: |-
    CREATE TABLE summary_largest_payments AS
    SELECT payee_canonical AS payee, agency_canonical AS agency, invoice_amount, invoice_number,
           invoice_date, fiscal_year, expenditure_type, fund
    FROM expenditures
    WHERE invoice_amount IS NOT NULL AND invoice_amount > 0 AND is_data_artifact = FALSE
    ORDER BY invoice_amount DESC
- table: summary_top_salaries
  question: What are the highest-paid job titles?
  requires:
  - salary_data
  sql: |-
    CREATE TABLE summary_top_salaries AS
    -- Latest COMPLETE calendar year only; distinct people, not person-year
    -- rows. The newest CalYear is a year-to-date snapshot, so this uses the
    -- highest year actually LOADED below it — the same derivation as
    -- data_model.year_context, so this table and the prompt's CalYear rule
    -- can never point at different years (a computed MAX-1 would name a
    -- missing year if the loaded years ever have a gap).
    SELECT jobTitle AS job_title, Department AS department,
           CalYear AS calendar_year,
           ROUND(AVG(YTD_Total), 2) AS avg_total_comp,
           ROUND(MAX(YTD_Total), 2) AS max_total_comp,
           COUNT(DISTINCT Employee_Name) AS employee_count
    FROM salary_data
    WHERE CalYear = (SELECT MAX(CalYear) FROM salary_data
                     WHERE CalYear < (SELECT MAX(CalYear) FROM salary_data))
    GROUP BY jobTitle, Department, CalYear
    ORDER BY avg_total_comp DESC
- table: summary_expenditure_type
  question: How does spending break down between operating and capital?
  sql: |-
    CREATE TABLE summary_expenditure_type AS
    SELECT expenditure_type, fiscal_year,
           ROUND(SUM(extended_amount), 2) AS total_spend,
           COUNT(*) AS transaction_count
    FROM expenditures WHERE is_data_artifact = FALSE AND expenditure_type IS NOT NULL
    GROUP BY expenditure_type, fiscal_year
    ORDER BY fiscal_year, total_spend DESC
- table: summary_agency_contractors
  question: Which agencies use the most licensed contractors?
  requires:
  - active_contractors
  sql: |-
    CREATE TABLE summary_agency_contractors AS
    SELECT e.agency_canonical AS agency, COUNT(DISTINCT ac.fullname) AS contractor_count,
           ROUND(SUM(e.extended_amount), 2) AS total_contractor_spend
    -- Dedupe to one row per business: active_contractors carries multiple
    -- license-category rows per FULLNAME, and joining the raw table fans each
    -- expenditure row out once per license, inflating total_contractor_spend
    -- (~$6.8M phantom spend measured FY22-24). contractor_count was already
    -- COUNT(DISTINCT), so only the dollar sum was wrong. Dedupe on LOWER(FULLNAME)
    -- — the SAME key the join uses — so two casings of one business (ACME INC /
    -- Acme Inc) collapse to one row and cannot re-introduce the fan-out.
    FROM (SELECT DISTINCT LOWER(FULLNAME) AS fullname FROM active_contractors WHERE FULLNAME IS NOT NULL) ac
    JOIN expenditures e ON LOWER(e.payee) = ac.fullname
    WHERE e.is_data_artifact = FALSE
    GROUP BY e.agency_canonical
    ORDER BY contractor_count DESC
- table: summary_top_contractors
  question: Who are the registered agents for the top contractors?
  requires:
  - contractor_profiles
  sql: |-
    CREATE TEMP TABLE _payee_canonical_totals AS
    SELECT payee_canonical AS payee,
           ROUND(SUM(extended_amount), 2) AS canonical_total
    FROM expenditures
    WHERE is_data_artifact = FALSE AND payee_canonical IS NOT NULL
    GROUP BY payee_canonical;
    CREATE TEMP TABLE _payee_to_canonical AS
    SELECT DISTINCT payee AS raw_payee, payee_canonical
    FROM expenditures WHERE payee IS NOT NULL;
    CREATE TABLE summary_top_contractors AS
    SELECT
        cp.payee AS payee_original,
        COALESCE(pc.payee_canonical, cp.payee) AS payee,
        COALESCE(ct.canonical_total, cp.total_spend) AS total_spend,
        cp.sos_registered_agent, cp.sos_officers,
        cp.sos_company_type, cp.sos_employees, cp.sos_county, cp.sos_file_date,
        cp.agencies_served, cp.years_active, cp.transaction_count
    FROM contractor_profiles cp
    LEFT JOIN _payee_to_canonical pc ON pc.raw_payee = cp.payee
    LEFT JOIN _payee_canonical_totals ct ON ct.payee = COALESCE(pc.payee_canonical, cp.payee)
    WHERE cp.sos_registered_agent IS NOT NULL
    ORDER BY total_spend DESC
- table: summary_grant_funding
  question: How much grant funding has Louisville received?
  sql: |-
    CREATE TABLE summary_grant_funding AS
    SELECT fund, ROUND(SUM(extended_amount), 2) AS total_amount,
           COUNT(*) AS transaction_count,
           MIN(fiscal_year) AS first_year, MAX(fiscal_year) AS last_year
    FROM expenditures
    WHERE is_data_artifact = FALSE
        AND (LOWER(fund) LIKE '%grant%' OR LOWER(fund) LIKE '%federal%'
             OR LOWER(fund) LIKE '%cares%' OR LOWER(fund) LIKE '%cdbg%'
             OR LOWER(fund) LIKE '%esg%' OR LOWER(fund) LIKE '%pass thru%'
             OR LOWER(fund) LIKE '%shelter%' OR LOWER(fund) LIKE '%home %'
             OR LOWER(fund) LIKE '%hopwa%' OR LOWER(fund) LIKE '%cap kaca%'
             OR LOWER(fund) LIKE '%stimulus%')
    GROUP BY fund
    ORDER BY total_amount DESC
dictionary:
  active_contractors:
    description: Licensed contractors registered with Louisville Metro.
    record_scope: Each row is a licensed contractor.
    joins: Join to expenditures on FULLNAME <-> payee (fuzzy match needed).
    labels:
      FULLNAME: Contractor Name
      LICENSENO: License Number
      CATEGORY: Category
      DESCRIPTION: Description
      ADDRESS1: Address
      CITY: City
      STATE: State
      ZIPCODE: Zip Code
      EXPIRATIONDATE: License Expiration
      EMAIL: Email
      DAYTIMEPHONE: Phone
    columns:
      FULLNAME: Contractor business name.
      LICENSENO: License number.
      CATEGORY: Contractor category code.
      DESCRIPTION: Category description (e.g., General Building, Electrical).
      EXPIRATIONDATE: License expiration date.
  capital_projects:
    description: Capital improvement projects with geographic locations and allocations.
    record_scope: Each row is a capital project.
    joins: Join to expenditures on Project_Na <-> project, Agency_Org <-> agency, Council_Di <-> region.
    labels:
      Project_Na: Project Name
      Agency_Org: Agency
      Project: Project Type
      Council_Di: Council District
      Allocation: Allocation
      Description: Description
      Priority_Area: Priority Area
      Start_Date: Start Date
      End_Date: End Date
      Chief: Chief
      Executive_: Executive
    columns:
      Project_Na: Project name.
      Agency_Org: Responsible agency/organization.
      Project: Project category (e.g., Park, Library, Road).
      Council_Di: Council district number.
      Allocation: Budget allocation amount.
      Description: Project description.
      Priority_Area: Priority area designation.
      Start_Date: Project start date.
      End_Date: Project end date.
      Chief: Chief officer responsible.
      Executive_: Executive sponsor.
  contractor_profiles:
    description: Enriched profiles for top 200 payees by spend. Combines expenditure history, contractor
      license data, and KY Secretary of State business entity records.
    record_scope: Each row is a payee/contractor with aggregated spend data and business registration
      details.
    joins: Join to expenditures on payee <-> payee. This is the primary table for questions about contractors,
      vendors, company ownership, registered agents, and business details.
    labels:
      payee: Payee
      total_spend: Total Spend
      transaction_count: Transaction Count
      years_active: Years Active
      first_year: First Year
      last_year: Last Year
      agencies_served: Agencies Served
      agency_list: Agency List
      funds_used: Funds Used
      expenditure_types: Expenditure Types
      CATEGORY: Contractor Category
      DESCRIPTION: Contractor Description
      LICENSENO: License Number
      ADDRESS1: Address
      CITY: City
      STATE: State
      ZIPCODE: Zip Code
      EMAIL: Email
      DAYTIMEPHONE: Phone
      sos_org_number: SOS Org Number
      sos_status: Business Status
      sos_standing: Business Standing
      sos_company_type: Company Type
      sos_industry: Industry
      sos_employees: Employee Size
      sos_county: County
      sos_file_date: Date Filed
      sos_principal_office: Principal Office
      sos_managed_by: Managed By
      sos_registered_agent: Registered Agent
      sos_officers: Current Officers
    columns:
      payee: Payee/vendor name as it appears in expenditure records.
      total_spend: Total expenditure amount received across all years.
      transaction_count: Number of expenditure transactions.
      years_active: Number of distinct fiscal years with transactions.
      first_year: First fiscal year with transactions.
      last_year: Most recent fiscal year with transactions.
      agencies_served: Number of distinct agencies this payee received payments from.
      agency_list: Semicolon-separated list of agencies.
      CATEGORY: Contractor license category (from Louisville Metro).
      DESCRIPTION: Contractor license description.
      LICENSENO: Louisville Metro contractor license number.
      sos_org_number: Kentucky Secretary of State organization number.
      sos_status: Business entity status (e.g., A - Active).
      sos_standing: Business standing (e.g., G - Good).
      sos_company_type: Company type (e.g., Kentucky LLC, Kentucky Corporation).
      sos_industry: Industry classification from KY SOS.
      sos_employees: Employee size category (Small, Medium, Large 100+).
      sos_county: Primary county of the business.
      sos_file_date: Date the business was filed/incorporated.
      sos_principal_office: Principal office address.
      sos_managed_by: Management structure (Members, Managers, etc.).
      sos_registered_agent: Name and address of the registered agent — the person legally responsible
        for receiving official documents on behalf of the company.
      sos_officers: 'Current officers and directors from KY Secretary of State filings. Format: ''Title:
        Name; Title: Name''. Includes President, VP, Secretary, Treasurer, Directors, Members, Managers.
        Available for ~31 companies that use corporate agent services (CT Corporation, etc.) as their
        registered agent.'
  expenditures:
    description: 'Louisville Metro government expenditure transactions, FY2008-FY2026. Unified from two
      schema eras: 2008-2017 (old format) and 2018+ (current format).'
    record_scope: Each row is a single invoice line item / payment distribution.
    labels:
      fiscal_year: Fiscal Year
      invoice_date: Invoice Date
      invoice_number: Invoice Number
      invoice_amount: Invoice Amount
      payee: Payee
      payment_date: Payment Date
      payment_number: Payment Number
      payment_amount: Payment Amount
      payment_void_date: Payment Void Date
      agency: Agency
      sub_agency: Sub Agency
      department: Department
      sub_department: Sub Department
      expenditure_type: Expenditure Type
      expenditure_category: Expenditure Category
      spend_category: Spend Category
      stimulus_type: Stimulus Type
      cost_center: Cost Center
      project: Project
      program: Program
      grant_: Grant
      fund: Fund
      financing_source: Financing Source
      region: Region
      extended_amount: Extended Amount
      agency_canonical: Agency (Normalized)
      payee_canonical: Payee (Normalized)
      is_offsetting: Offsetting Entry
      is_data_artifact: Data Artifact
    columns:
      fiscal_year: The fiscal year of the expenditure (July-June cycle). Integer.
      invoice_date: Date the invoice was issued.
      invoice_number: Unique identifier for the invoice.
      invoice_amount: Total dollar amount on the invoice.
      payee: Vendor or recipient name.
      payment_date: Date payment was issued.
      payment_number: Unique identifier for the payment/check.
      payment_amount: Total check amount (present only in raw source files; NOT a column in the queryable expenditures table).
      payment_void_date: Date payment was voided, if applicable (present only in raw source files; NOT a column in the queryable expenditures table).
      agency: Metro government agency responsible for the expenditure.
      sub_agency: Sub-agency detail (present only in raw source files; NOT a column in the queryable expenditures table).
      department: Department within the agency (present only in raw source files; NOT a column in the queryable expenditures table).
      sub_department: Sub-department detail (present only in raw source files; NOT a column in the queryable expenditures table).
      expenditure_type: 'High-level type: Operating or Capital.'
      expenditure_category: Category of expenditure.
      spend_category: Detailed spend classification.
      stimulus_type: Federal stimulus funding type, if applicable (present only in raw source files; NOT a column in the queryable expenditures table).
      cost_center: Organizational cost center code and name (2018+ data only).
      project: Project name or code (2018+ data only).
      program: Program name or code (2018+ data only).
      grant_: Grant identifier and description (2018+ data only).
      fund: Funding source (e.g., General Fund, Grant Fund, Capital Project Fund).
      financing_source: Specific financing source detail (2018+ data only).
      region: Council district or geographic region (2018+ data only).
      extended_amount: Distributed/allocated amount for this line item. Use this for spend analysis.
      agency_canonical: Normalized agency name. Use this instead of 'agency' for aggregations to avoid
        duplicate entities from naming variations.
      payee_canonical: Normalized payee/vendor name. Maps abbreviations and variants to canonical names
        (e.g., 'LG&E' and 'LOUISVILLE GAS & ELECTRIC COMPANY' both become 'Louisville Gas & Electric Company').
        Use this instead of 'payee' when grouping or filtering by vendor.
  hr_requisitions:
    description: Human resources hiring requisition log.
    record_scope: Each row is a hiring requisition.
    joins: Join to expenditures on DEPARTMENT <-> agency.
    labels:
      DEPARTMENT: Department
      JOB_TITLE: Job Title
      JOB_CODE: Job Code
      UNION_: Union
      HIRE_STATUS: Hire Status
      TYPE_OF_HIRE: Hire Type
      WORK_LOCATION: Work Location
    columns:
      DEPARTMENT: Department with the open position.
      JOB_TITLE: Position title.
      JOB_CODE: Job classification code.
      UNION_: Union affiliation.
      HIRE_STATUS: Current hiring status.
      TYPE_OF_HIRE: Type of hire (new, replacement, etc.).
      WORK_LOCATION: Work location.
  salary_data:
    description: Annual salary and compensation data for Louisville Metro employees,
      calendar year 2021 to present ONLY — a rolling recent window that does NOT
      reach back to 2008 like the expenditures table. The newest loaded year is
      in progress, so its year-to-date totals are partial. YTD_Total is the sum
      of pay components (regular, overtime, incentive, other) and does NOT
      include benefits.
    record_scope: Each row is one employee's compensation for one calendar year
      (a person-year, not a person — the same employee appears once per year).
    joins: Join to expenditures on Department <-> agency (fuzzy match needed).
    labels:
      CalYear: Calendar Year
      Employee_Name: Employee Name
      Department: Department
      jobTitle: Job Title
      Annual_Rate: Annual Rate
      Regular_Rate: Regular Pay
      Overtime_Rate: Overtime Pay
      Incentive_Allowance: Incentive Allowance
      Other: Other Pay
      YTD_Total: Year-to-Date Total
    columns:
      CalYear: Calendar year of the salary record.
      Employee_Name: Full name of the employee.
      Department: Department name.
      jobTitle: Job title/position.
      Annual_Rate: Annual salary rate.
      Regular_Rate: Regular pay received.
      Overtime_Rate: Overtime pay received.
      Incentive_Allowance: Incentive and allowance pay.
      Other: Other compensation.
      YTD_Total: Total year-to-date pay (regular + overtime + incentive + other; no
        benefits). Dollar amounts — a value like 192770.57 is ~$193K. Partial for
        the in-progress year.
  summary_top_salaries:
    description: Average and maximum total pay by job title and department for a
      single complete calendar year — see the calendar_year column for which one.
      Values are in dollars (a value like 192770.57 is ~$193K, not millions) and
      are the sum of pay components (regular, overtime, incentive, other) —
      benefits are NOT included. High averages for field titles (e.g. EMS
      paramedics) are usually overtime-driven.
    record_scope: Each row is one (job title, department) group within the single
      calendar year named in the calendar_year column.
    columns:
      job_title: Job title/position.
      department: Department name (the same title can appear in several departments).
      calendar_year: The complete calendar year the figures cover.
      avg_total_comp: Average total pay in dollars across employees in the group.
      max_total_comp: Highest individual total pay in dollars in the group.
      employee_count: Number of DISTINCT employees in the group that year.
  staff_demographics:
    description: Workforce demographics by department, gender, ethnicity, and education level.
    record_scope: Each row is a demographic group count within a department.
    joins: Join to expenditures on Department <-> agency.
    labels:
      DepartmentID: Department ID
      Department: Department
      Gender: Gender
      EthnicGroup: Ethnic Group
      HighestEducationLevel: Education Level
      NumberOfEmployees: Number of Employees
    columns:
      Department: Department name.
      Gender: Gender category.
      EthnicGroup: Ethnic group category.
      HighestEducationLevel: Highest education level.
      NumberOfEmployees: Count of employees in this group.
