- id: largest-payments
  tags: [summary]
  question: What are the largest single payments ever made and who received them?
  reference_sql: SELECT payee FROM summary_largest_payments ORDER BY invoice_amount DESC LIMIT 1
  check: contains
  contains: ["Louisville Arena Authority"]
  answer_scalar: false

- id: capital-projects
  tags: [summary]
  question: What are the largest capital projects and how much was allocated to each?
  reference_sql: SELECT Project_Na FROM capital_projects
  check: min_rows
  min_rows: 5

- id: contract-splitting-fy2025
  tags: [summary]
  question: Are there signs of contract splitting in FY2025?
  reference_sql: SELECT 1
  check: min_rows
  min_rows: 5
  answer_scalar: false

- id: honest-empty-fy2031
  tags: [guard]
  question: How much did Louisville Fire spend in fiscal year 2031?
  reference_sql: SELECT 1
  check: expect_empty
  answer_scalar: false

- id: off-topic
  tags: [guard]
  question: Tell me a joke about cats.
  reference_sql: SELECT 1
  check: expect_refusal
  answer_scalar: false
