- id: mayor-and-chief-pay
  tags: [entity]
  question: How much does the mayor make? What about the police chief?
  reference_sql: >
    SELECT YTD_Total FROM salary_data WHERE jobTitle = 'Police Chief' AND CalYear = 2025
  check: contains
  contains: ["Greenberg", "Humphrey"]
  answer_scalar: true   # the prose must state the chief's pay; naming is judged by the SQL

- id: highest-paid-positions
  tags: [summary]
  question: What are the highest paid positions in Louisville Metro government?
  reference_sql: >
    SELECT job_title FROM summary_top_salaries
    WHERE calendar_year = (SELECT MAX(calendar_year) FROM summary_top_salaries) AND job_title IS NOT NULL
    ORDER BY avg_total_comp DESC LIMIT 3
  check: top_labels

- id: police-overtime-2024
  tags: [vocabulary, entity]
  question: How much overtime pay did police employees receive in 2024?
  reference_sql: >
    SELECT ROUND(SUM(Overtime_Rate), 2) FROM salary_data
    WHERE Department ILIKE '%police%' AND CalYear = 2024
  check: scalar
  tolerance: 0.05

- id: registered-agents
  tags: [summary]
  question: Who are the registered agents for the top 10 contractors by total spend?
  reference_sql: SELECT payee FROM summary_top_contractors ORDER BY total_spend DESC LIMIT 5
  check: top_labels

- id: grant-funding
