# Runs the pytest suite on every push / PR. The golden expenditure CSVs are
# gitignored, so data-bound tests (known-answer invariants, the /api/ask
# end-to-end suite) skip here via tests/conftest.py; every pure-function and
# in-memory-DuckDB test still runs, which is the regression net for the engine
# logic, prompts, SQL helpers, model fallback, RAG, and the heartbeat script.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests (data-bound tests auto-skip without the gitignored data)
        run: python -m pytest -q -rs
