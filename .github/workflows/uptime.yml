# External uptime probe for the production bot (louisville-open-data-5q5).
# Runs from GitHub's network through Cloudflare — the same path real users
# take. A failing run triggers GitHub's workflow-failure notification.
#
# Failure conditions:
#   - /api/health unreachable, non-200, or status != "ok"
#   - model_fallback non-null (the configured model was deprecated at the
#     provider; the app survived via runtime fallback but wants attention)
#   - /api/ask SSE probe (empty question — free, no LLM call) not returning
#     200 text/event-stream
# errors_last_hour > 0 is a warning annotation only: with status still "ok"
# it's <= 5 errors/hour, which is usually per-IP rate-limit noise.
#
# GitHub disables schedule-triggered workflows after 60 days without repo
# activity — for a monitor, silent death is the worst failure mode. The
# keep-alive step re-enables this workflow via the API on every run, which
# resets that counter; it is the only reason the token needs actions:write.

name: uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: write  # keep-alive self-re-enable only; everything else defaults to none

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Production is LouStack behind CloudFront since the 2026-09-23 cutover
    # (louisville-open-data-lla); the hostname is the only thing worth probing.
    env:
      BASE: https://louisville.raylytics.io
    steps:
      - name: Keep-alive (reset the 60-day scheduled-workflow auto-disable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/uptime.yml/enable" \
            || echo "::warning::keep-alive re-enable failed (non-fatal)"
      - name: Health probe
        run: |
          body=$(curl -sS --fail --max-time 20 "$BASE/api/health")
          echo "$body" | jq .
          status=$(echo "$body" | jq -r .status)
          fallback=$(echo "$body" | jq -c '.model_fallback // empty')
          errs=$(echo "$body" | jq -r '.errors.errors_last_hour // 0')
          if [ "$status" != "ok" ]; then
            echo "::error::/api/health status=$status"
            exit 1
          fi
          if [ -n "$fallback" ]; then
            echo "::error::model fallback engaged (configured model deprecated at provider): $fallback"
            exit 1
          fi
          if [ "$errs" != "0" ]; then
            echo "::warning::errors_last_hour=$errs (status still ok — likely rate-limit noise)"
          fi
          # On the Lambda deployment the counters live in DynamoDB; the app
          # reports that backend's own health separately (state_backend).
          backend=$(echo "$body" | jq -r '.state_backend.status // "ok"')
          if [ "$backend" != "ok" ]; then
            echo "::error::state backend degraded: $(echo "$body" | jq -c .state_backend)"
            exit 1
          fi

      - name: API end-to-end probe (SSE handshake, no LLM cost)
        run: |
          # x-amz-content-sha256 = sha256 of the body; required behind CloudFront
          # OAC (SigV4 body hash), harmless on the current origin. Keep in sync
          # with monitoring/louisville-bot-heartbeat.sh (test-asserted there).
          body='{"question":""}'
          code_type=$(curl -sS -o /dev/null --max-time 30 \
            -w '%{http_code} %{content_type}' \
            -X POST "$BASE/api/ask" \
            -H 'Content-Type: application/json' \
            -H "x-amz-content-sha256: $(printf '%s' "$body" | sha256sum | cut -d' ' -f1)" \
            --data "$body")
          echo "probe result: $code_type"
          case "$code_type" in
            "200 text/event-stream"*) echo "SSE probe ok" ;;
            *) echo "::error::/api/ask probe failed: $code_type"; exit 1 ;;
          esac
